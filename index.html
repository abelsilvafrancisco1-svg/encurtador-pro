  <!--
    One-time cache recovery.

    Users upgrading across the 1.15 / 1.17 boundary can end up with a stale
    Flutter service worker, HTTP-cached main.dart.js, or an old CanvasKit
    build, producing Crashlytics#recordError MissingPluginException and
    "s.addOval is not a function" errors. Unregistering the SW and clearing
    Cache Storage does not evict the browser's separate HTTP cache for
    same-origin script URLs; we force-reload those entry files before
    location.reload().

    If localStorage is unreadable (throws), we still run unregister / clear /
    refetch — only skip when getItem returns a truthy marker.

    On first visit after this ships: unregister service workers, wipe Cache
    Storage, replace HTTP-cached entry bundles, then reload once. Bump the
    localStorage key (v3 -> v4 -> ...) if a future deploy needs another pass.
  -->
  <script>
    (function () {
      var key = 'zapia_cache_flushed_v7';
      try {
        if (localStorage.getItem(key)) return;
      } catch (_) {}

      var hasServiceWorker = 'serviceWorker' in navigator;
      var hasCacheStorage = typeof caches !== 'undefined';
      var hasFetch = typeof fetch === 'function';
      if (!hasServiceWorker && !hasCacheStorage) {
        try { localStorage.setItem(key, '1'); } catch (_) {}
        return;
      }

      var unregisterAll = hasServiceWorker
        ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }).catch(function () {})
        : Promise.resolve();

      var clearCaches = hasCacheStorage
        ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (name) {
              return caches.delete(name);
            }));
          }).catch(function () {})
        : Promise.resolve();

      // Bust the browser HTTP cache for fixed-name entry files (independent of SW / caches API).
      var pathsToHardReload = [
        'flutter.js',
        'flutter_bootstrap.js',
        'main.dart.js',
        'main.dart.mjs',
        'main.dart.wasm',
        'flutter_service_worker.js',
        'version.json',
        'manifest.json',
        'assets/AssetManifest.json',
        'assets/AssetManifest.bin.json',
        'assets/FontManifest.json',
      ];
      var refetchEntryBundles = hasFetch
        ? Promise.all(
            pathsToHardReload.map(function (p) {
              var url;
              try {
                url = new URL(p, document.baseURI).href;
              } catch (e) {
                return Promise.resolve();
              }
              return fetch(url, { cache: 'reload', mode: 'same-origin' }).catch(function () {});
            })
          )
        : Promise.resolve();

      Promise.all([unregisterAll, clearCaches, refetchEntryBundles]).then(function () {
        try { localStorage.setItem(key, '1'); } catch (_) {}
        location.reload();
      });
    })();
  </script>

}

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000000;
    }

    #splash {
      position: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #000000;
      opacity: 1;
      transition: opacity 0.4s ease;
      z-index: 9999;
      overflow: hidden;
    }

    .splash-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .splash-icon {
      width: 128px;
      height: 128px;
      border-radius: 22px;
      animation: splashPulse 2s ease-in-out infinite;
    }

    .splash-loading-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .progress-bar-container {
      width: 160px;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: rgba(34, 189, 171, 0.8);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    @keyframes splashPulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(34, 189, 171, 0.3));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(34, 189, 171, 0.5));
        transform: scale(1.03);
      }
    }

<body>
  <div id="splash">
    <div class="splash-logo-container">
      <img class="splash-icon" src="icons/Icon-512.png" alt="Zapia">
      <div class="splash-loading-text" id="splash-text">Loading...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <!--
    Flutter loader: inline because Flutter's build tool replaces
    "3361190339" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */ at build time.
    Its SHA-256 hash is computed from build/web/index.html and injected into
    nginx.conf by scripts/compute-csp-hashes.py during CI.
  -->
  <script defer>
    window.addEventListener('load', function(ev) {
      const splash = document.getElementById('splash');

      // Animate progress bar with non-linear increments (slows down near 90%)
      const progressBar = document.getElementById('progressBar');
      let progress = 0;
      const progressInterval = setInterval(() => {
        if (progress < 90) {
          progress += (90 - progress) * 0.04;
          progressBar.style.width = progress + '%';
        }
      }, 100);

      // Rotate loading text in sync with the logo pulse animation.
      // Uses transitionend to avoid hardcoding the CSS transition duration.
      const splashTexts = ['Loading...', 'Cargando...', 'Carregando...'];
      let splashTextIndex = 0;
      const splashTextEl = document.getElementById('splash-text');
      const splashIcon = document.querySelector('.splash-icon');
      const handleIteration = () => {
        splashTextEl.style.opacity = '0';
        splashTextEl.addEventListener('transitionend', function onFadeOut() {
          splashTextEl.removeEventListener('transitionend', onFadeOut);
          splashTextIndex = (splashTextIndex + 1) % splashTexts.length;
          splashTextEl.textContent = splashTexts[splashTextIndex];
          splashTextEl.style.opacity = '1';
        }, { once: true });
      };
      splashIcon.addEventListener('animationiteration', handleIteration);

      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: "3361190339" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine({
            useColorEmoji: true,
          });
          await appRunner.runApp();
          // Double-RAF: first schedules Flutter's paint, second fires after
          // the browser has composited that frame — avoids blank flash.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            splashIcon.removeEventListener('animationiteration', handleIteration);
            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            splash.style.opacity = '0';
            splash.addEventListener('transitionend', function() {
              splash.style.display = 'none';
            });
          }));
        },
      });
    });
  </script>

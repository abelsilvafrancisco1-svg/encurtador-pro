<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disparo de SMS em Massa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    h1 { color: #1a73e8; font-size: 24px; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #1a73e8; }
    textarea { resize: vertical; min-height: 100px; }
    .numeros-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 8px;
      min-height: 120px;
      font-family: monospace;
      resize: vertical;
    }
    .info { font-size: 12px; color: #888; margin-bottom: 20px; }
    .contador { font-size: 13px; color: #1a73e8; font-weight: 600; margin-bottom: 20px; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1558b0; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .btn-limpar {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #e53935;
      border: 1px solid #e53935;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-limpar:hover { background: #fdecea; }
    .log {
      margin-top: 24px;
      background: #f8f9fa;
      border-radius: 10px;
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      display: none;
    }
    .log .item { padding: 4px 0; border-bottom: 1px solid #eee; }
    .log .item.ok { color: #2e7d32; }
    .log .item.err { color: #c62828; }
    .log .item.info { color: #555; }
    .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-top: 16px; display: none; }
    .progress-bar-inner { height: 100%; background: #1a73e8; border-radius: 4px; width: 0%; transition: width 0.3s; }
    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #999; letter-spacing: 0.5px; margin-bottom: 12px; }
    hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>📲 Disparo de SMS em Massa</h1>
  <p class="subtitle">Envie a mesma mensagem para até 1.200 contatos de uma vez.</p>

  <hr/>
  <div class="section-title">🔑 Credenciais Twilio</div>

  <label>Account SID</label>
  <input type="text" id="accountSid" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />

  <label>Auth Token</label>
  <input type="password" id="authToken" placeholder="Seu Auth Token" />

  <label>Número Twilio (com DDI)</label>
  <input type="text" id="fromNumber" placeholder="Ex: +15551234567" />

  <hr/>
  <div class="section-title">📋 Contatos</div>

  <label>Cole os números aqui (um por linha, com DDI)</label>
  <textarea class="numeros-box" id="numeros" placeholder="+5511999999999&#10;+5521888888888&#10;+5531777777777"></textarea>
  <div class="info">Formato: +DDI + DDD + número. Ex: +5511999999999</div>
  <div class="contador" id="contador">0 número(s) detectado(s)</div>
  <button class="btn-limpar" onclick="limparNumeros()">🗑️ Limpar lista</button>

  <hr/>
  <div class="section-title">✉️ Mensagem</div>

  <label>Mensagem a enviar</label>
  <textarea id="mensagem" placeholder="Digite sua mensagem aqui..."></textarea>
  <div class="info" id="charCount">0 / 160 caracteres</div>

  <button class="btn" id="btnEnviar" onclick="enviarSMS()">🚀 Enviar para todos</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-bar-inner" id="progressBarInner"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  document.getElementById('numeros').addEventListener('input', atualizarContador);
  document.getElementById('mensagem').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length + ' / 160 caracteres';
  });

  function atualizarContador() {
    const nums = getNumeros();
    document.getElementById('contador').textContent = nums.length + ' número(s) detectado(s)';
  }

  function getNumeros() {
    return document.getElementById('numeros').value
      .split('\n')
      .map(n => n.trim())
      .filter(n => n.length > 7);
  }

  function limparNumeros() {
    document.getElementById('numeros').value = '';
    atualizarContador();
  }

  function log(msg, tipo) {
    tipo = tipo || 'info';
    const logDiv = document.getElementById('log');
    logDiv.style.display = 'block';
    const item = document.createElement('div');
    item.className = 'item ' + tipo;
    item.textContent = msg;
    logDiv.appendChild(item);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  async function enviarSMS() {
    const accountSid = document.getElementById('accountSid').value.trim();
    const authToken = document.getElementById('authToken').value.trim();
    const fromNumber = document.getElementById('fromNumber').value.trim();
    const mensagem = document.getElementById('mensagem').value.trim();
    const numeros = getNumeros();

    if (!accountSid || !authToken || !fromNumber) {
      alert('Preencha as credenciais da Twilio!');
      return;
    }
    if (numeros.length === 0) {
      alert('Adicione pelo menos um número!');
      return;
    }
    if (!mensagem) {
      alert('Digite uma mensagem!');
      return;
    }

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = '⏳ Enviando...';

    const progressBar = document.getElementById('progressBar');
    const progressBarInner = document.getElementById('progressBarInner');
    progressBar.style.display = 'block';

    document.getElementById('log').innerHTML = '';
    log('Iniciando envio para ' + numeros.length + ' contato(s)...', 'info');

    let enviados = 0;
    let erros = 0;

    for (let i = 0; i < numeros.length; i++) {
      const numero = numeros[i];
      try {
        const response = await fetch(
          'https://api.twilio.com/2010-04-01/Accounts/' + accountSid + '/Messages.json',
          {
            method: 'POST',
            headers: {
              'Authorization': 'Basic ' + btoa(accountSid + ':' + authToken),
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
              From: fromNumber,
              To: numero,
              Body: mensagem
            })
          }
        );
        const data = await response.json();
        if (response.ok) {
          enviados++;
          log('✅ ' + numero + ' — enviado', 'ok');
        } else {
          erros++;
          log('❌ ' + numero + ' — erro: ' + data.message, 'err');
        }
      } catch (e) {
        erros++;
        log('❌ ' + numero + ' — falha de conexão', 'err');
      }

      const pct = Math.round(((i + 1) / numeros.length) * 100);
      progressBarInner.style.width = pct + '%';

      await new Promise(function(r) { setTimeout(r, 300); });
    }

    log('Concluído: ' + enviados + ' enviados, ' + erros + ' erros.', 'info');
    btn.disabled = false;
    btn.textContent = '🚀 Enviar para todos';
  }
</script>
</body>
</html>

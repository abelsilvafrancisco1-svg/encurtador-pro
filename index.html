<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK NEWS DIGITAL | Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: none; background: #262626; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; background: #00e676; color: black; }
        .btn-red { background: #ff0000; color: white; margin-top: 10px; text-decoration: none; display: block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>OK NEWS DIGITAL</h2>
        <p>Encurtador Profissional</p>
        
        <input type="text" id="linkInput" placeholder="Cole seu link longo aqui...">
        <button class="btn" onclick="gerarLink()">ENcurtar e Ganhar</button>
        
        <div id="resultado" style="margin-top: 20px;"></div>

        <a href="https://www.youtube.com/@OKNEWSDIGITAL?sub_confirmation=1" target="_blank" class="btn btn-red">Inscrever-se no Canal</a>
    </div>

    <script>
        function gerarLink() {
            const url = document.getElementById('linkInput').value;
            const token = "SEU_API_TOKEN"; // <--- COLOQUE O SEU TOKEN AQUI
            
            if(!url) { alert("Cole um link!"); return; }

            // Usando o método de redirecionamento via URL da API, que é mais estável
            const urlFinal = https://shrinkme.io/api?api=${token}&url=${encodeURIComponent(url)};
            
            // Em vez de processar no fundo, abrimos o link da API que já retorna o resultado
            window.open(urlFinal, '_blank');
            document.getElementById('resultado').innerHTML = "O seu link monetizado foi gerado numa nova janela!";
        }
    </script>
</body>
</html>

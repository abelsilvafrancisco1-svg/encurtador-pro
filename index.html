<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>OK NEWS DIGITAL - Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; color: white; }
        .btn-inscreva { background: #ff0000; }
        .btn-check { background: #007bff; }
        #area-encurtador { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; background: #333; color: white; }
    </style>
</head>
<body>

    <div class="box">
        <div id="tela-inicial">
            <h1>Bem-vindo ao Encurtador de Link Pro</h1>
            <p>1. Inscreva-se no canal:</p>
            <a href="https://www.youtube.com/@OKNEWSDIGITAL?sub_confirmation=1" target="_blank" class="btn btn-inscreva">INSCREVER-SE</a>
            
            <p>2. Clique abaixo para confirmar e liberar:</p>
            <button class="btn btn-check" onclick="liberarAcesso()">CONFIRMAR INSCRIÇÃO E LIBERAR</button>
        </div>

        <div id="area-encurtador">
            <h3>Encurtador de Link Pro</h3>
            <input type="text" id="linkInput" placeholder="Cole o seu link longo aqui...">
            <button class="btn" style="background:#28a745" onclick="encurtar()">GERAR LINK CURTO</button>
            <p id="resultado"></p>
        </div>
    </div>

    <script>
        function liberarAcesso() {
            document.getElementById('tela-inicial').style.display = 'none';
            document.getElementById('area-encurtador').style.display = 'block';
        }
        function encurtar() {
            const url = document.getElementById('linkInput').value;
            const finalUrl = "https://tinyurl.com/api-create.php?url=" + encodeURIComponent(url);
            fetch(finalUrl).then(res => res.text()).then(data => {
                document.getElementById('resultado').innerHTML = "Link curto: <strong>" + data + "</strong>";
            });
        }
    </script>
</body>
</html>
